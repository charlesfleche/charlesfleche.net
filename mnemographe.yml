# Configuration of bin/mnemographe.py: the gallery it ingests photos into,
# and the networks it posts them to. Each `post` call posts one photo to one
# network. Secrets are never stored here: Mastodon reads its access token from
# POSTER_MASTODON_API_TOKEN, Instagram its password from
# POSTER_INSTAGRAM_PASSWORD.

images: content/page/2022-01-01-mnemographe

destinations:
  # The destination name is the one passed on the command line, and the one
  # used for the payload sidecars: <image stem>.mastodon.json
  mastodon:
    type: mastodon
    instance: https://mamot.fr
    visibility: public
    language: en
    # Prepended to the tags of every image, in this order.
    default_tags: [Mnémographe, Photo, Photography]
  # Instagram's private API, through instagrapi: logs in as username with
  # POSTER_INSTAGRAM_PASSWORD, and uploads the photo file.
  instagram:
    type: instagram
    username: charlesfleche_
    default_tags: [Mnémographe, Photo, Photography]
