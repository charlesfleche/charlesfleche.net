# Configuration of bin/mnemographe.py, which ingests new photos into the
# gallery and posts the next unposted one to each destination. Access tokens
# are never stored here: every destination reads its own
# POSTER_<DESTINATION>_API_TOKEN environment variable, e.g.
# POSTER_MASTODON_API_TOKEN.

images: content/page/2022-01-01-mnemographe

destinations:
  # The destination name is the one passed on the command line, and the one
  # used for the payload sidecars: <image stem>.mastodon.json
  mastodon:
    type: mastodon
    instance: https://mamot.fr
    visibility: public
    language: en
    # Prepended to the tags of every image, in this order.
    default_tags: [Mnémographe, Photo, Photography]
